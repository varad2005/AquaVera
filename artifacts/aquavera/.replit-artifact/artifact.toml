kind = "web"
previewPath = "/"
title = "AquaVera"
version = "1.0.0"
id = "artifacts/aquavera"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22898

[services.development]
run = "pnpm --filter @workspace/aquavera run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aquavera", "run", "build" ]
publicDir = "artifacts/aquavera/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22898"
BASE_PATH = "/"
